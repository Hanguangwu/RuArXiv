name: validate-papers

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "papers/**"
      - "schemas/**"
      - "scripts/validate-content.ts"
      - "src/lib/content.ts"
      - "src/lib/abstract.ts"
      - "src/lib/authors.ts"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    branches: ["main"]
    paths:
      - "papers/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client
        run: pnpm db:generate
      - name: Validate paper metadata and directory layout
        run: pnpm validate
      - name: Typecheck
        run: pnpm typecheck
