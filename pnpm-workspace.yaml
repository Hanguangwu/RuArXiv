# pnpm 11 replaced `onlyBuiltDependencies` with `allowBuilds`. CI installs with
# `strictDepBuilds` enabled, so unreviewed lifecycle scripts fail the install
# with ERR_PNPM_IGNORED_BUILDS. Prisma needs client generation and engine
# download; esbuild (used by tsx) needs its native binary.
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  prisma: true
